# ============================================================
# Credit Risk Scoring Engine — Central Configuration
# ============================================================

project:
  name: "Credit Risk Scoring Engine"
  version: "1.0.0"
  random_seed: 42

# ── Paths ────────────────────────────────────────────────────
paths:
  raw_data: "data/raw/accepted_2007_to_2018Q4.csv.gz"
  processed_data: "data/processed/loans_processed.parquet"
  train_data: "data/splits/train.parquet"
  val_data: "data/splits/val.parquet"
  test_data: "data/splits/test.parquet"
  model_dir: "models/"
  model_path: "models/xgboost_pipeline_v1.joblib"
  feature_names_path: "models/feature_names.json"
  shap_values_path: "models/shap_values_sample.npy"
  shap_sample_path: "models/shap_sample_X.parquet"

# ── Data ─────────────────────────────────────────────────────
data:
  nrows: 500000
  target_column: "loan_status"
  positive_class_labels:
    - "Charged Off"
    - "Default"
    - "Does not meet the credit policy. Status:Charged Off"
  negative_class_labels:
    - "Fully Paid"
    - "Does not meet the credit policy. Status:Fully Paid"
  # Rows with these statuses are indeterminate — drop them
  drop_statuses:
    - "Current"
    - "In Grace Period"
    - "Late (16-30 days)"
    - "Late (31-120 days)"
    - "Issued"
  test_size: 0.20
  val_size: 0.10
  max_null_pct: 0.40   # Drop columns with >40% nulls

# ── Features ─────────────────────────────────────────────────
features:
  numeric:
    - loan_amnt
    - funded_amnt
    - int_rate
    - installment
    - annual_inc
    - dti
    - delinq_2yrs
    - fico_range_low
    - fico_range_high
    - inq_last_6mths
    - open_acc
    - pub_rec
    - revol_bal
    - revol_util
    - total_acc
    - credit_age_months
    - payment_to_income
    - loan_to_income
    - income_log
    - delinq_rate
  categorical:
    - term
    - grade
    - sub_grade
    - emp_length_years_cat
    - home_ownership
    - purpose
    - addr_state
    - initial_list_status
    - application_type
  engineered:
    - payment_to_income
    - loan_to_income
    - credit_age_months
    - income_log
    - delinq_rate

# ── Model ─────────────────────────────────────────────────────
model:
  name: "xgboost"
  # Best params found via GridSearchCV (update after tuning)
  params:
    max_depth: 5
    n_estimators: 300
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 4
    min_child_weight: 3
    objective: "binary:logistic"
    eval_metric: "auc"
    use_label_encoder: false
    random_state: 42
    n_jobs: -1
  # GridSearchCV grid
  tuning_grid:
    max_depth: [4, 5, 6]
    n_estimators: [300, 500]
    learning_rate: [0.05, 0.1]
    subsample: [0.8]
    colsample_bytree: [0.8]
    scale_pos_weight: [4]
    min_child_weight: [3]
  cv_folds: 5
  scoring: "roc_auc"

# ── SHAP ─────────────────────────────────────────────────────
shap:
  sample_size: 1000   # Number of test rows to compute SHAP on
  max_display: 20     # Features to show in summary plot
